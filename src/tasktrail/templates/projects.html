<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Projects</title>
    </head>
    <body>
        <h1>Projects</h1>
            {% if projects %}
              <ul>
                {% for project in projects %}
                  <li>
                    <ul>
                      {% for task in project.tasks %}
                        <li>{{ task.title }}</li>
                      {% endfor %}
                    </ul>
                    <br>
                    {{ project.description|default("No description yet.") }}
                  </li>
                {% endfor %}
              </ul>
            {% else %}
              <p>You don't have any projects yet.</p>
            {% endif %}
    </body>
</html>
