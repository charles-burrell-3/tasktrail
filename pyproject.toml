[project]
name = "tasktrail"
folder = "src/tasktrail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "charlie", email = "deltafront@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "ruff>=0.17.6",
]

[project.scripts]
tasktrail = "tasktrail:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
extend-exclude = ["tests", "hello.py", "verify_env.py"]

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "pytest>=9.2.0",
    "pytest-coverage>=0.0",
    "ruff>=0.17.6",
]

[tool.coverage.run]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]
